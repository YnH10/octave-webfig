[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octave-webfig"
version = "0.1.0"
description = "Interactive Octave figures (zoom/pan/rotate, uicontrol callbacks, drawnow animation) inside Jupyter / VS Code notebook output cells"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "YnH10" }]
requires-python = ">=3.9"
keywords = ["octave", "jupyter", "notebook", "vscode", "widgets", "uicontrol", "plotting", "interactive"]
classifiers = [
    "Framework :: Jupyter",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "octave_kernel>=0.34",
    "metakernel>=0.29",
    "anywidget>=0.9",
    "ipywidgets>=8",
]

[project.urls]
Homepage = "https://github.com/YnH10/octave-webfig"
Issues = "https://github.com/YnH10/octave-webfig/issues"

[tool.setuptools]
packages = ["octave_webfig"]

[tool.setuptools.package-data]
octave_webfig = ["m/*.m", "static/*.js", "static/*.css"]
